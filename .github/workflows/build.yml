
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Luba Mobile
    runs-on: ubuntu-latest

    steps:
      # 1. Télécharger le dépôt
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Installer Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Installer le SDK Android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;35.0.0

      # 4. Installer Gradle 8.13
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 5. Vérifier la structure
      - name: Verify Project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f application/build.gradle.kts
          test -f application/src/main/AndroidManifest.xml
          echo "Project structure verified"

      # 6. Compiler l'application
      - name: Build Debug APK
        run: gradle :application:assembleDebug --stacktrace

      # 7. Vérifier l'APK
      - name: Verify APK
        run: |
          find application/build/outputs/apk/debug \
            -name "*.apk" -type f

      # 8. Publier l'APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LubaMobile-APK
          path: application/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
