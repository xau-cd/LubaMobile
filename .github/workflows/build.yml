
name: Build Luba Mobile APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Récupérer le dépôt
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Installer Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurer Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Vérifier le SDK Android préinstallé
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK introuvable."
            exit 1
          fi

          find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager

      # 5. Installer les composants Android
      - name: Install Android Components
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable."
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # 6. Vérifier les fichiers du projet
      - name: Verify Project Structure
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/www/index.html

          echo "Structure Android valide."

      # 7. Vérifier Gradle Wrapper
      
- name: Vérifier le wrapper Gradle
  run: |
    set -eux
    test -f gradlew
    test -f gradle/wrapper/gradle-wrapper.jar
    test -f gradle/wrapper/gradle-wrapper.properties
    chmod +x gradlew
    ./gradlew --version


      # 8. Vérifier la configuration Android
      - name: Verify Android Project
        run: |
          ./gradlew :app:tasks --all

      # 9. Compiler l'application
      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 10. Vérifier le résultat
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK non générée."
            find app/build/outputs -type f || true
            exit 1
          fi

          ls -lh "$APK"

      # 11. Publier l'APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LubaMobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
