
name: Build Luba Mobile APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construire Luba Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Récupération du dépôt
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configuration Java 17
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configuration Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Installation du SDK Android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Installation des composants Android nécessaires
      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # 6. Vérification de la structure du projet
      - name: Verify Project Structure
        run: |
          echo "=== ROOT DIRECTORY ==="
          ls -la

          echo "=== APP MODULE ==="
          ls -la app/

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/www/index.html

          echo "Project structure verified successfully."

      # 7. Vérification de Gradle
      - name: Verify Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
          else
            echo "Gradle wrapper absent du dépôt."
            exit 1
          fi

      # 8. Vérification de la configuration Android
      - name: Verify Android Configuration
        run: |
          echo "Checking Android module..."
          ./gradlew :app:tasks --all

      # 9. Compilation de l'APK Debug
      - name: Build Debug APK
        run: |
          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 10. Vérification de l'APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated."
            find app/build/outputs -type f || true
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      # 11. Publication de l'APK comme artefact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LubaMobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
