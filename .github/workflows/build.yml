
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construire Luba Mobile
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le projet
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Installer Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurer Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Installer les composants Android
      - name: Install Android Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Vérifier les fichiers
      - name: Verify Project Structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f application/build.gradle.kts
          test -f application/src/main/AndroidManifest.xml

          echo "Luba Mobile project structure OK"

      # 6. Installer Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 7. Compiler APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon \
            :application:assembleDebug \
            --stacktrace

      # 8. Vérifier APK
      - name: Verify APK
        run: |
          APK="application/build/outputs/apk/debug/application-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK introuvable"
            find application/build/outputs -type f || true
            exit 1
          fi

          echo "APK généré avec succès"

      # 9. Télécharger APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LubaMobile-APK
          path: application/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
