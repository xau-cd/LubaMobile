
name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Luba Mobile APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le projet
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Installer Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Installer le SDK Android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: 'platform-tools'

      # 4. Vérifier les outils Android
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          adb version
          sdkmanager --version

      # 5. Vérifier Gradle Wrapper
      - name: Check Gradle Wrapper
        run: |
          test -f ./gradlew
          chmod +x ./gradlew

      # 6. Compiler le projet Android
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. Vérifier la génération APK
      - name: Verify APK
        run: |
          find app/build/outputs/apk/debug -name "*.apk" -type f

      # 8. Publier le fichier APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LubaMobile-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
